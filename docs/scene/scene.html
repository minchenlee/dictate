<!doctype html><html><head><meta charset="utf-8"><style>
:root{--fg:#1d1d1f;--fg2:#6e6e73;--fg3:#a1a1a6;--win:#fff;--bar:#f5f5f7;--line:rgba(0,0,0,.09);--side:#f2f2f4;--sel:rgba(0,0,0,.07);--accent:#0a84ff;--menu:rgba(255,255,255,.42);--menufg:#000;
--wall:radial-gradient(1200px 700px at 15% 10%,#b9d4ff 0,transparent 60%),radial-gradient(900px 700px at 90% 30%,#ffd6e5 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#ffe3c4 0,transparent 60%),#dfe6f5}
.dark{--fg:#f5f5f7;--fg2:#a1a1a6;--fg3:#6e6e73;--win:#1e1e20;--bar:#2a2a2d;--line:rgba(255,255,255,.08);--side:#262629;--sel:rgba(255,255,255,.08);--menu:rgba(20,20,30,.35);--menufg:#fff;
--wall:radial-gradient(1200px 700px at 15% 10%,#2b3d78 0,transparent 60%),radial-gradient(900px 700px at 90% 30%,#4d2a5e 0,transparent 60%),radial-gradient(900px 600px at 50% 110%,#5a3a2a 0,transparent 60%),#12152a}
*{box-sizing:border-box;margin:0}
body{width:1280px;height:800px;overflow:hidden;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text";color:var(--fg);background:var(--wall);position:relative;-webkit-font-smoothing:antialiased}
.menubar{position:absolute;top:0;left:0;right:0;height:26px;background:var(--menu);backdrop-filter:blur(30px) saturate(1.6);display:flex;align-items:center;padding:0 12px;color:var(--menufg);font-size:13px;gap:20px}
.menubar b{font-weight:700}.menubar .r{margin-left:auto;display:flex;gap:16px;align-items:center}
.menubar img{height:15px;display:block}.menubar img.mic{height:16px}
.win{position:absolute;background:var(--win);border-radius:12px;box-shadow:0 0 0 .5px rgba(0,0,0,.25),0 22px 70px rgba(0,0,0,.28),0 4px 14px rgba(0,0,0,.12);overflow:hidden;display:flex;flex-direction:column}
.dark .win{box-shadow:0 0 0 .5px rgba(255,255,255,.14),0 22px 70px rgba(0,0,0,.6)}
.tb{height:52px;display:flex;align-items:center;padding:0 18px;gap:8px;border-bottom:1px solid var(--line);background:var(--bar);flex:none}
.tl{display:flex;gap:8px}.tl i{width:12px;height:12px;border-radius:50%;display:block;box-shadow:inset 0 0 0 .5px rgba(0,0,0,.15)}
.tl i:nth-child(1){background:#ff5f57}.tl i:nth-child(2){background:#febc2e}.tl i:nth-child(3){background:#28c840}
.title{font-weight:600;font-size:13px;margin-left:14px}
.caret{display:inline-block;width:2px;height:1.15em;background:var(--accent);vertical-align:-.2em;margin-left:1px;border-radius:1px}
.hud{position:absolute;left:50%;bottom:56px;transform:translateX(-50%);width:111px}
/* notes */
.notes .side{width:220px;background:var(--side);border-right:1px solid var(--line);padding:10px}
.notes .item{padding:9px 12px;border-radius:8px;margin-bottom:2px}.notes .item b{display:block;font-size:13px;font-weight:600}.notes .item span{font-size:12px;color:var(--fg2)}
.notes .item.on{background:#ffd60a55}.dark .notes .item.on{background:#ffd60a33}
.notes .doc{flex:1;padding:30px 44px;font-size:15px;line-height:1.6}
.notes .doc .date{text-align:center;color:var(--fg3);font-size:12px;margin-bottom:18px}
.notes .doc h1{font-size:24px;font-weight:700;margin-bottom:12px}
.notes .doc p{margin-bottom:12px}
/* chat */
.chat .thread{flex:1;padding:22px 24px;display:flex;flex-direction:column;gap:8px;font-size:14px}
.b{max-width:62%;padding:8px 13px;border-radius:18px;line-height:1.35}
.b.in{background:var(--side);align-self:flex-start}.dark .b.in{background:#3a3a3d}
.b.out{background:var(--accent);color:#fff;align-self:flex-end}
.chat .time{align-self:center;color:var(--fg3);font-size:11px;margin:6px 0}
.chat .input{margin:10px 16px 16px;border:1px solid var(--line);border-radius:18px;padding:8px 14px;font-size:14px;min-height:36px;background:var(--win)}
.dark .chat .input{border-color:rgba(255,255,255,.16)}
/* mail */
.mail .row{display:flex;gap:10px;padding:10px 22px;border-bottom:1px solid var(--line);font-size:13px}.mail .row span{color:var(--fg2);width:56px}
.mail .body{padding:18px 22px;font-size:14px;line-height:1.6}.mail .body p{margin-bottom:12px}
/* term */
.term{background:#1c1c1e!important;color:#e5e5ea}.term .tb{background:#2a2a2d;border-color:#000}.term .title{color:#c7c7cc}
.term .body{flex:1;padding:16px 18px;font:13px/1.55 "SF Mono",Menlo,monospace}
.term .dim{color:#8e8e93}.term .ok{color:#30d158}.term .acc{color:#ff9f0a}
.term .box{margin-top:14px;border:1px solid #48484a;border-radius:8px;padding:10px 12px}
.term .caret{background:#e5e5ea}
</style></head><body>
<div class="menubar"><b id="app">Notes</b><span>File</span><span>Edit</span><span>Format</span><span>View</span><span>Window</span><span>Help</span>
<div class="r"><img class="mic" id="mic"><img id="wifi"><img id="batt"><img id="search"><img id="cc"><span>Sat Oct 11&nbsp;&nbsp;10:42</span></div></div>
<div id="stage"></div>
<img class="hud" id="hud">
<script>
const [kind, theme] = location.hash.slice(1).split("-");
const dark = theme === "dark"; if (dark) document.body.classList.add("dark");
const t = dark ? "white" : "black";
mic.src = "sym/mic-red.png"; wifi.src = `sym/wifi-${t}.png`; batt.src = `sym/battery-${t}.png`; search.src = `sym/search-${t}.png`; cc.src = `sym/cc-${t}.png`;
hud.src = `../images/hud-recording-${theme}.png`;
const C = '<span class="caret"></span>';
const scenes = {
 notes: ["Notes", `<div class="win notes" style="left:170px;top:84px;width:940px;height:560px"><div class="tb"><div class="tl"><i></i><i></i><i></i></div></div><div style="display:flex;flex:1">
  <div class="side"><div class="item on"><b>Pride and Prejudice</b><span>10:41 · It is a truth universally…</span></div><div class="item"><b>Book club picks</b><span>Yesterday · Moby-Dick, Middlemarch</span></div><div class="item"><b>Trip to Kyoto</b><span>Thursday · Book the ryokan</span></div><div class="item"><b>Groceries</b><span>Monday · Oat milk, lemons</span></div></div>
  <div class="doc"><div class="date">October 11, 2026 at 10:41 AM</div><h1>Pride and Prejudice</h1><p>It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.</p><p>However little known the feelings or views of such a man may be on his first entering a neighbourhood, this truth is so well fixed in the minds of the surrounding families, that he is considered the rightful property of some one or other of their daughters.${C}</p></div></div></div>`],
 chat: ["Messages", `<div class="win chat" style="left:300px;top:84px;width:680px;height:560px"><div class="tb"><div class="tl"><i></i><i></i><i></i></div><span class="title">Book Club</span></div><div class="thread">
  <div class="time">Today 10:31</div><div class="b in">Did anyone actually finish Moby-Dick? 🐋</div><div class="b out">Almost! I'm at the chapter about the whiteness of the whale.</div><div class="b in">That chapter is wild. Who picks next month?</div><div class="b in">I vote for something shorter 😅</div><div class="b out">Fair. What about Pride and Prejudice?</div><div class="b in">Yes please. Can you send the meetup details?</div></div>
  <div class="input">Sure. Next Saturday at 3, same café on Elm Street. Bring your copy${C}</div></div>`],
 mail: ["Mail", `<div class="win mail" style="left:250px;top:84px;width:780px;height:560px"><div class="tb"><div class="tl"><i></i><i></i><i></i></div><span class="title">Book club: November pick</span></div>
  <div class="row"><span>To:</span>book-club@example.com</div><div class="row"><span>Subject:</span>Book club: November pick</div>
  <div class="body"><p>Hi everyone,</p><p>Thanks for a great discussion on Saturday. For November we are reading <i>Pride and Prejudice</i>. It opens with one of the best first lines in English:</p><p>“It is a truth universally acknowledged, that a single man in possession of a good fortune, must be in want of a wife.”</p><p>We will meet on the 15th at the same café. If you can bring snacks, reply to this email and${C}</p></div></div>`],
 term: ["Terminal", `<div class="win term" style="left:200px;top:84px;width:880px;height:560px"><div class="tb"><div class="tl"><i></i><i></i><i></i></div><span class="title">~/projects/reader — zsh</span></div><div class="body">
  <div><span class="ok">➜</span> <span class="acc">reader</span> <span class="dim">git:(main)</span> npm test</div><div class="dim">&nbsp;</div><div><span class="ok">✓</span> 128 passed <span class="dim">(2.4s)</span></div><div class="dim">&nbsp;</div>
  <div><span class="ok">➜</span> <span class="acc">reader</span> <span class="dim">git:(main)</span> ai</div><div class="box"><span class="dim">›</span> The chapter list loads slowly on long books like Moby-Dick. Cache the table of contents after the first open, and add a test that opens a book with more than one hundred chapters${C}</div></div></div>`],
};
const [app, html] = scenes[kind]; document.getElementById("app").textContent = app; stage.innerHTML = html;
</script></body></html>
